<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>성현의 휴대폰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#141418;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;color:#111;letter-spacing:-.025em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss06","tnum" 0;text-rendering:optimizeLegibility}
#phone *{word-break:keep-all}
.bub{word-break:break-all!important}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
#device{width:414px;height:868px;border-radius:64px;background:#0a0a0c;padding:12px;box-shadow:0 0 0 2px #2c2c32,0 0 0 5px #0a0a0c,0 40px 90px rgba(0,0,0,.65);position:relative;flex:none}
#phone{user-select:none;-webkit-user-select:none;width:390px;height:844px;border-radius:52px;overflow:hidden;position:relative;background:#000}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:90;pointer-events:none}
@media (max-width:500px){body{display:block}#device{width:100vw;height:100dvh;padding:0;border-radius:0;box-shadow:none;transform:none!important}#phone{width:100%;height:100%;border-radius:0}.island{display:none}}
#sb{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 44px;font-weight:600;font-size:16.5px;letter-spacing:-.01em;z-index:80;pointer-events:none;color:#000;transition:color .2s}
#sb.light{color:#fff}
#sb .r{display:flex;gap:6px;align-items:center}
#sb svg{fill:currentColor}
.bat{display:flex;align-items:center;gap:1px}.bat i{display:block;width:25px;height:12px;border:1.4px solid currentColor;border-radius:4px;opacity:.9;padding:1.2px}.bat i b{display:block;height:100%;width:41%;background:currentColor;border-radius:1.5px}.bat em{width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0;opacity:.5}
#hi{position:absolute;bottom:0;left:0;right:0;height:26px;z-index:85;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;cursor:pointer}
#hi i{width:136px;height:5px;border-radius:3px;background:#000;opacity:.85}
#hi.light i{background:#fff}
#screen{position:absolute;inset:0;touch-action:pan-y;overflow:hidden}
.scroll>*{transform:translateY(var(--ob,0px))}
.shade{position:absolute;inset:0;background:#000;pointer-events:none;z-index:60;opacity:0}
img{-webkit-user-drag:none}
.view{backface-visibility:hidden}
.irow [data-x]{transform:scale(.484);transform-origin:0 0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.slide{animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.zoom{animation:zoom .3s cubic-bezier(.2,.8,.2,1)}
@keyframes zoom{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pt54{padding-top:54px}

/* photo placeholder */
.ph{position:relative;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 55% 74%),hsl(calc(var(--h) + 40) 42% 46%));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph b{font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.ph i{font-style:normal;font-size:11px;margin-top:6px;padding:0 8px;text-shadow:0 1px 3px rgba(0,0,0,.35);line-height:1.3}
.ph u{position:absolute;top:5px;left:6px;text-decoration:none;font-size:9px;background:rgba(0,0,0,.28);padding:1px 4px;border-radius:4px;font-weight:600}
.cell .ph i,.tiny .ph i{display:none}.cell .ph b{font-size:26px}
.av{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;overflow:hidden}
.sq .av,.av.sq{border-radius:38%}

/* lock */
.lock{background:#000;color:#fff;align-items:center}
.lock .wall{position:absolute;inset:0}
.lock .wall::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,0) 40%,rgba(0,0,0,.35))}
.lock .wtag{position:absolute;right:14px;bottom:110px;font-size:9px;opacity:.5;z-index:2}
.lk{position:relative;z-index:3;width:100%;display:flex;flex-direction:column;align-items:center;flex:1}
.lk .date{margin-top:66px;font-size:20px;font-weight:600;opacity:.92}
.lk .time{font-size:96px;font-weight:700;line-height:1;letter-spacing:-2px;margin-top:2px;font-family:"Pretendard Variable",Pretendard,sans-serif;font-weight:600;letter-spacing:-.04em;font-feature-settings:"tnum"}
.lk .widgets{display:flex;gap:10px;margin-top:12px;font-size:13px;opacity:.9}
.lk .widgets span{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);padding:5px 10px;border-radius:12px}
.notis{margin-top:auto;width:100%;padding:0 10px 14px;display:flex;flex-direction:column;gap:8px}
.noti{background:rgba(245,245,245,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#000;border-radius:20px;padding:11px 14px;display:flex;gap:10px;align-items:center;cursor:pointer;animation:zoom .5s both}
.noti .ni{width:38px;height:38px;border-radius:9px;flex:none;overflow:hidden}
.noti .nb{flex:1;min-width:0}.noti .nh{display:flex;justify-content:space-between;font-size:13px}.noti .nh b{font-weight:600}.noti .nh span{opacity:.5;font-size:12px}
.noti .nt{font-size:14px;line-height:1.3;margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lkbot{display:flex;justify-content:space-between;width:100%;padding:0 46px 40px;align-items:center}
.lkbot .c{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:20px}
.swipe{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.75;z-index:3;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* passcode */
.pass{position:absolute;inset:0;z-index:70;background:rgba(20,20,28,.62);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:110px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.pass .pt{font-size:20px;font-weight:500}
.pass .pdots{display:flex;gap:22px;margin:22px 0 10px}
.pass .pdots i{width:13px;height:13px;border-radius:50%;border:1.4px solid #fff}
.pass .pdots i.on{background:#fff}
.pass .phint{height:20px;font-size:13px;opacity:.8}
.pass .pkeys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 24px;margin-top:24px}
.pass .k{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:background .1s}
.pass .k:active{background:rgba(255,255,255,.45)}
.pass .k b{font-size:34px;font-weight:400;line-height:1}.pass .k small{font-size:10px;letter-spacing:2px;font-weight:600;opacity:.9}
.pass .pfoot{display:flex;justify-content:space-between;width:300px;margin-top:auto;margin-bottom:46px;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}

/* home */
.home{background:#000}
.home .wall{position:absolute;inset:0}
.home .grid{position:relative;z-index:2;padding:62px 20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;width:76px;cursor:pointer;position:relative}
.app .ic{width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.app span{font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap}
.app:active .ic{filter:brightness(.75)}
.badge{position:absolute;top:-6px;right:1px;background:#ff3b30;color:#fff;font-size:13px;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-weight:500;z-index:2}
.wd{grid-column:span 2;width:158px;height:158px;border-radius:22px;padding:14px;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.wd-d{background:linear-gradient(160deg,#90b8e0,#4a6fa5)}
.wd-d .t{font-size:12px;opacity:.9}.wd-d .n{font-size:40px;font-weight:700;margin-top:18px;letter-spacing:-1px}.wd-d .s{font-size:12px;opacity:.85;margin-top:4px}
.wd-d .hearts{position:absolute;right:12px;top:12px;font-size:20px}
.wd-c{background:#fff;color:#000}
.wd-c .dw{color:#ff3b30;font-size:12px;font-weight:600}.wd-c .dn{font-size:34px;font-weight:300;line-height:1.1}
.wd-c .wev{font-size:11.5px;border-left:3px solid #ff9f0a;padding-left:6px;margin-top:6px;line-height:1.3}.wd-c .wev.b{border-color:#5e5ce6}
.wd-c .wev small{display:block;opacity:.5}
.wd span.lbl{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11.5px}
.dots{position:absolute;bottom:118px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:#fff}.dots i+i{opacity:.4}
.dock{position:absolute;left:12px;right:12px;bottom:12px;height:94px;border-radius:32px;background:rgba(255,255,255,.28);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:2;display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.dock .app span{display:none}

/* generic iOS nav */
.nav{height:98px;padding:54px 12px 0;display:flex;align-items:center;justify-content:space-between;flex:none;position:relative}
.nav .back{color:#007aff;font-size:17px;display:flex;align-items:center;gap:2px;min-width:70px}
.nav .back svg{width:12px;height:20px}
.nav .ttl{position:absolute;left:90px;right:90px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;top:66px}
.nav .rt{min-width:70px;text-align:right;color:#007aff;font-size:17px}
.big{font-size:34px;font-weight:700;padding:4px 16px 8px;letter-spacing:-.035em}
.search{margin:0 16px 10px;background:#eeeef0;border-radius:10px;height:36px;display:flex;align-items:center;padding:0 10px;color:#8e8e93;font-size:16px;gap:6px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,30,30,.88);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:20px;z-index:95;white-space:nowrap;animation:fadein .2s}

/* viewer */
.viewer{position:absolute;inset:0;background:#000;z-index:75;display:flex;flex-direction:column;justify-content:center;animation:fadein .2s}
.viewer .ph{width:100%;aspect-ratio:3/4}
.viewer .ph b{font-size:70px}.viewer .ph i{font-size:16px}.viewer .ph u{font-size:12px;top:10px;left:10px}
.viewer .vt{position:absolute;top:60px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
.viewer .vx{position:absolute;top:56px;right:18px;color:#fff;font-size:26px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:72;display:flex;align-items:flex-end;animation:fadein .2s}
.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:10px 0 40px;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#ccc;margin:0 auto 14px}

/* KAKAO */
.kk{background:#fff}
.kk .khead{padding:58px 18px 10px;display:flex;justify-content:space-between;align-items:center;flex:none}
.kk .khead h1{font-size:22px;margin:0;font-weight:700}
.kk .khead .icons{display:flex;gap:18px;font-size:20px}
.ktabs{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:8px 0 30px;flex:none;background:#fff}
.ktabs button{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#aaa;gap:3px}
.ktabs button.on{color:#111}
.ktabs svg{width:24px;height:24px}
.kli{display:flex;align-items:center;gap:12px;padding:8px 18px;cursor:pointer}
.kli:active{background:#f5f5f5}
.kli .kn{flex:1;min-width:0}
.kli .kn b{font-size:15px;font-weight:600;display:flex;gap:5px;align-items:center}.kli .kn b em{font-style:normal;color:#aaa;font-weight:400;font-size:14px}
.kli .kn p{margin:2px 0 0;font-size:13px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kli .km{text-align:right;font-size:11.5px;color:#aaa;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.kli .km i{font-style:normal;background:#ff4d3d;color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:1px 6px}
.kli .pin{font-size:10px;color:#bbb}
.ksec{font-size:12px;color:#999;padding:12px 18px 4px}
.kad{margin:4px 18px 8px;border-radius:12px;background:#f6f6f6;padding:12px;font-size:12px;color:#777;display:flex;gap:10px;align-items:center}
.kchat{background:#b2c7da}
.kchat .knav{padding:54px 10px 8px;display:flex;align-items:center;gap:8px;flex:none;background:#b2c7da}
.kchat .knav .back{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.kchat .knav h2{flex:1;font-size:17px;margin:0;font-weight:600}.kchat .knav h2 em{font-style:normal;color:#56677a;font-weight:400;margin-left:4px;font-size:15px}
.kchat .knav .icons{display:flex;gap:16px;font-size:18px;padding-right:6px}
.kbody{padding:6px 10px 14px}
.kdate{margin:14px auto 10px;width:max-content;background:rgba(0,0,0,.12);color:#fff;font-size:12px;padding:4px 12px;border-radius:12px}
.krow{display:flex;gap:7px;margin-top:4px;align-items:flex-start}
.krow.first{margin-top:10px}
.krow.me{justify-content:flex-end}
.kav{width:40px;flex:none}
.kcol{max-width:74%;display:flex;flex-direction:column}
.krow.me .kcol{align-items:flex-end}
.kname{font-size:12.5px;color:#4a5560;margin:0 0 4px 2px}
.kline{display:flex;align-items:flex-end;gap:5px}
.krow.me .kline{flex-direction:row-reverse}
.kt{font-size:10px;color:#556270;white-space:nowrap;flex:none}
.kchat .bub{background:#fff;padding:8px 11px;border-radius:14px;font-size:14.5px;line-height:1.42;word-break:break-all}
.kchat .krow.first:not(.me) .bub{border-top-left-radius:4px}
.kchat .krow.me .bub{background:#fee500}
.kchat .krow.me.first .bub{border-top-right-radius:4px}
.mph .ph{width:200px;height:240px;border-radius:12px}
.emo{font-size:64px;line-height:1.1}
.bub.file{display:flex;gap:10px;align-items:center;min-width:210px}
.bub.file .fi{width:38px;height:38px;border-radius:9px;background:#3a3a3a;color:#fee500;display:flex;align-items:center;justify-content:center;font-size:20px}
.bub.file b{font-size:13.5px;display:block;font-weight:600}.bub.file small{font-size:11px;color:#888}
.kinput{background:#fff;display:flex;align-items:center;gap:10px;padding:8px 10px 34px;flex:none}
.kinput .plus{width:30px;height:30px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:22px;color:#888}
.kinput .f{flex:1;background:#f2f2f2;border-radius:18px;height:36px;display:flex;align-items:center;padding:0 12px;color:#aaa;font-size:14px}
.kprof{background:#333;color:#fff;justify-content:flex-end}
.kprof .pbg{position:absolute;inset:0}
.kprof .pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.1) 40%,rgba(0,0,0,.6))}
.kprof .px{position:absolute;top:58px;left:16px;font-size:26px;z-index:3}
.kprof .pc{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;padding-bottom:30px}
.kprof .pc h3{margin:12px 0 4px;font-size:19px}.kprof .pc p{margin:0;font-size:13.5px;opacity:.85}
.kprof .pbtn{display:flex;gap:44px;margin-top:30px;border-top:1px solid rgba(255,255,255,.2);padding-top:18px;width:100%;justify-content:center;font-size:12px}
.kprof .pbtn button{display:flex;flex-direction:column;align-items:center;gap:6px}
.kprof .pbtn b{font-size:22px}

/* INSTAGRAM */
.ig{background:#fff}
.ig .ihead{padding:52px 14px 6px;display:flex;align-items:center;justify-content:space-between;flex:none}
.ig .logo{font-family:"Grand Hotel",cursive;font-size:32px}
.ig .ihead .icons{display:flex;gap:20px;font-size:22px;position:relative}
.dmbadge{position:absolute;top:-4px;right:-8px;background:#ff3040;color:#fff;font-size:10px;border-radius:9px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-weight:700}
.itabs{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:10px 0 32px;flex:none;background:#fff;font-size:22px}
.itabs .av{border:1.5px solid #000}
.stories{display:flex;gap:14px;padding:6px 12px 12px;overflow-x:auto;border-bottom:1px solid #efefef;scrollbar-width:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;width:70px;flex:none;cursor:pointer}
.st .ring{padding:2.5px;border-radius:50%;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.st .ring.seen{background:#dbdbdb}
.st .ring>div{border:3px solid #fff;border-radius:50%}
.st span{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .phd{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:13.5px;font-weight:600}
.post .phd small{display:block;font-weight:400;font-size:11.5px;color:#555}
.post .phd .m{margin-left:auto;font-weight:700}
.post .ph.sq{width:100%;aspect-ratio:1}
.post .acts{display:flex;gap:16px;padding:10px 12px 4px;font-size:23px}
.post .acts span:last-child{margin-left:auto}
.post .pl{padding:0 12px;font-size:13.5px;line-height:1.45}
.post .pl b{font-weight:600}
.post .pdte{font-size:11.5px;color:#888;padding:4px 12px 16px}
.liked{color:#ff3040}
.prof .ptop{display:flex;align-items:center;padding:4px 16px;gap:18px}
.prof .stats{display:flex;flex:1;justify-content:space-around;text-align:center;font-size:13px}
.prof .stats b{display:block;font-size:16.5px}
.prof .bio{padding:10px 16px 0;font-size:13.5px;line-height:1.45;white-space:pre-line}
.prof .bio b{font-weight:600}
.prof .btns{display:flex;gap:6px;padding:12px 16px}
.prof .btns button{flex:1;background:#efefef;border-radius:8px;height:33px;font-weight:600;font-size:13.5px}
.prof .btns button.blue{background:#0095f6;color:#fff}
.hls{display:flex;gap:16px;padding:4px 16px 14px}
.hl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px}
.hl>div{border:1px solid #ddd;padding:3px;border-radius:50%}
.gtabs{display:flex;border-top:1px solid #eee;font-size:20px}.gtabs span{flex:1;text-align:center;padding:9px 0;color:#aaa}.gtabs span.on{color:#000;border-bottom:1.5px solid #000}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ggrid .ph{aspect-ratio:4/5}
.uname{font-weight:700;font-size:21px;display:flex;align-items:center;gap:6px;cursor:pointer}
.dmli{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer}
.dmli .t{flex:1;min-width:0;font-size:14px}.dmli .t p{margin:2px 0 0;color:#888;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmli.unread .t{font-weight:600}.dmli.unread .t p{color:#000;font-weight:600}

const phone=$('#phone'), screen=$('#screen');
function pd(id){const p=PH[id]||['사진','📷',0];return{l:p[0],e:p[1],h:p[2],src:p[3]||'',z:p[4]||0}}
function ph(id,cls=''){const p=pd(id);const click=cls.includes('noview')?'':`onclick="viewPh('${id}',event)"`;
  return `<div class="ph ${cls}" style="--h:${p.h}" ${click}>${p.src?`<img src="${p.src}" alt=""${p.z?` style="transform:scale(${p.z})"`:''}>`:`<b>${p.e}</b><i>${p.l}</i><u>${id}</u>`}</div>`}
function bgStyle(id){const p=pd(id);return p.src?`background:url('${p.src}') center/cover`:`background:linear-gradient(170deg,hsl(${p.h} 48% 30%),hsl(${p.h+30} 45% 9%))`}
function av(id,s,cls=''){
  if(PH[id]){const p=pd(id);return `<div class="av ${cls}" style="width:${s}px;height:${s}px;${p.src?`background:url('${p.src}') center/cover`:`background:linear-gradient(150deg,hsl(${p.h} 55% 74%),hsl(${p.h+40} 42% 46%))`}">${p.src?'':`<span style="font-size:${s*.46}px">${p.e}</span>`}</div>`}
  const [c,t]=(id||'#c7ccd3|').split('|');return `<div class="av ${cls}" style="width:${s}px;height:${s}px;background:${c}"><span style="font-size:${s*.4}px">${t||''}</span></div>`}
const chev=`<svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function nav(title,backLbl='',right=''){return `<div class="nav"><button class="back" onclick="back()">${chev}${backLbl}</button><div class="ttl">${title}</div><div class="rt">${right}</div></div>`}
function toast(t){const o=document.createElement('div');o.className='toast';o.textContent=t;phone.appendChild(o);setTimeout(()=>o.remove(),1700)}
function viewPh(id,e){if(e)e.stopPropagation();const p=pd(id);const o=document.createElement('div');o.className='viewer';
  o.innerHTML=`<div class="vt">${p.l}</div><button class="vx">✕</button>${ph(id,'noview')}`;o.onclick=()=>{o.remove();sbFor(screen.lastElementChild)};phone.appendChild(o);setSB(true)}
function sheet(html){const s=document.createElement('div');s.className='sheet-bg';s.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;s.onclick=e=>{if(e.target===s)s.remove()};phone.appendChild(s)}
function closeSheet(){document.querySelectorAll('.sheet-bg').forEach(e=>e.remove())}

function render(mode){

const maxS=sc=>Math.max(0,sc.scrollHeight-sc.clientHeight);

function fling(sc,pv){stopFling(sc);const M=maxS(sc);let p=sc.scrollTop-(sc._ob||0),last=performance.now();

    sc._raf=requestAnimationFrame(step)};

 L.forEach((m,i)=>{const [w,c,t]=m;

  const nx=L[i+1];const last=!nx||nx[0]!==w||nx[2]!==t;const first=!prev||prev[0]!==w;const me=w==='me';
  const nm=w==='h'?ch.name:w;const a=w==='h'?ch.av:(NAMEAV[w]||'');

const AU=new Audio();AU.preload='none';
const trCover=(k,i)=>PL[k].tr[i][3]||PL[k].cv;
function mini(){if(!NOW)return '';const t=PL[NOW[0]].tr[NOW[1]];return `<div class="mini"><div class="cv">${ph(trCover(NOW[0],NOW[1]),'noview')}</div><div class="tt">${t[0]}<small>${t[1]}${t[4]?' · 미리듣기':''}</small></div><button class="pp" onclick="toggleNow()">${NOW[2]?'⏸':'▶'}</button><button class="pp" onclick="nextTrack()">⏭</button><i class="prog" id="prog" style="width:${progV}%"></i></div>`}
function play(pl,i){NOW=[pl,i,true];progV=0;const t=PL[pl].tr[i];AU.pause();
  if(t[4]){AU.src=t[4];AU.play().catch(e=>{NOW[2]=false;render();toast(e&&e.name==='NotAllowedError'?'이 화면에서는 소리 재생이 막혀 있어요':'미리듣기 주소에 접속하지 못했어요 ('+(e&&e.name||'오류')+')')})}else AU.removeAttribute('src');
  render();startProg()}
function toggleNow(){NOW[2]=!NOW[2];if(PL[NOW[0]].tr[NOW[1]][4]){if(NOW[2])AU.play().catch(()=>{});else AU.pause()}render();if(NOW[2])startProg()}
function nextTrack(){play(NOW[0],(NOW[1]+1)%PL[NOW[0]].tr.length)}
AU.addEventListener('ended',()=>{if(NOW)nextTrack()});
let progV=0;function startProg(){clearInterval(nowTimer);nowTimer=setInterval(()=>{if(!NOW||!NOW[2])return clearInterval(nowTimer);
  if(PL[NOW[0]].tr[NOW[1]][4])progV=AU.duration?AU.currentTime/AU.duration*100:0;else progV=Math.min(100,progV+.8);const p=$('#prog');if(p)p.style.width=progV+'%'},250)}

${Object.entries(PL).map(([k,p])=>`<div class="mpl" onclick="go('music-pl','${k}')"><div class="cv">${ph(p.cv,'noview cell')}</div><div><b>${p.t}</b><small>플레이리스트 · ${p.by}</small></div></div>`).join('')}
<div style="font-size:20px;font-weight:700;padding:18px 16px 6px">최근 재생한 항목</div>
${[['night',0],['lane',2],['gh',0]].map(([k,i])=>`<div class="trk" onclick="play('${k}',${i})">${tcv(k,i)}<div class="tt"><b>${PL[k].tr[i][0]}</b><small>${PL[k].tr[i][1]}</small></div><span class="du">▶</span></div>`).join('')}</div>${mini()}</div>`;
V['music-pl']=k=>{const p=PL[k];return `<div class="view music">${nav('','보관함','⋯')}<div class="scroll"><div class="plhero"><div class="cv">${ph(p.cv,'noview')}</div><h2>${p.t}</h2><p>${p.by}</p>${p.note?`<div class="note">${p.note}</div>`:''}<div class="pb"><button onclick="play('${k}',0)">▶ 재생</button><button onclick="play('${k}',Math.floor(Math.random()*${p.tr.length}))">⤨ 셔플</button></div></div>
${p.tr.map((t,i)=>`<div class="trk ${NOW&&NOW[0]===k&&NOW[1]===i?'on':''}" onclick="play('${k}',${i})">${t[3]?tcv(k,i):`<span class="n">${i+1}</span>`}<div class="tt"><b>${t[0]}</b><small>${t[1]}</small></div><span class="du">${t[2]}</span></div>`).join('')}</div>${mini()}</div>`};

/* ---------- VOICE / PHONE / CLOCK / SAFARI / SETTINGS ---------- */
V.voice=()=>`<div class="view voice">${nav('','','편집')}<div class="big" style="padding-top:0">전체 녹음</div><div class="search">🔍 검색</div><div class="scroll">
${VOICE.map(([t,d,l],i)=>`<div class="vm" onclick="vmPlay(this,'${l}')"><b>${t}</b><div><span>${d}</span><span>${l}</span></div><div class="bar"><span>▶</span><i><em></em></i><span>${l}</span></div></div>`).join('')}</div>
<div style="display:flex;justify-content:center;padding:14px 0 40px;border-top:1px solid #eee"><div style="width:62px;height:62px;border-radius:50%;border:3px solid #ddd;display:flex;align-items:center;justify-content:center"><div style="width:50px;height:50px;border-radius:50%;background:#ff3b30"></div></div></div></div>`;
function vmPlay(el,l){document.querySelectorAll('.vm').forEach(x=>x!==el&&x.classList.remove('on'));el.classList.toggle('on');const em=el.querySelector('em');em.style.transition='none';em.style.width='0';
 if(el.classList.contains('on')){const [m,s]=l.split(':').map(Number);const sec=Math.min(m*60+s,12);requestAnimationFrame(()=>{em.style.transition=`width ${sec}s linear`;em.style.width='100%'})}}
V.phone=()=>`<div class="view">${nav('','','편집')}<div class="big" style="padding-top:0">최근 통화</div><div class="scroll"><div style="padding:0 0 0 16px">
${CALLS.map(([n,t,d,miss,du])=>`<div class="irow ${miss?'miss':''}" style="padding-left:0" onclick="toast('${miss?'부재중 전화':'통화 시간 '+du}')"><div class="tt"><b style="font-weight:600">${n}</b><small>${t}${du?' · '+du:''}</small></div><span class="rv">${d} ⓘ</span></div>`).join('')}</div></div>
<div class="itabs" style="font-size:11px;color:#999">${['⭐<br>즐겨찾기','<span style="color:#007aff">🕘<br>최근 통화</span>','👤<br>연락처','⌗<br>키패드','⏺<br>음성 사서함'].map(x=>`<span style="text-align:center">${x}</span>`).join('')}</div></div>`;
V.clock=()=>`<div class="view dark" data-sb="light">${nav('','편집','+')}<div class="big" style="padding-top:0">알람</div><div class="scroll">
${ALARMS.map(([t,ap,l,on],i)=>`<div class="alarm ${on?'':'off'}"><div class="tt"><b>${ap==='오전'?'<small style="margin:0 4px 0 0">오전</small>':'<small style="margin:0 4px 0 0">오후</small>'}${t}</b><p>${l}</p></div><div class="tog ${on?'on':''}" onclick="ALARMS[${i}][3]=!ALARMS[${i}][3];render()"></div></div>`).join('')}</div>
<div class="itabs" style="background:#111;border-color:#222;font-size:11px;color:#888">${['🌐<br>세계 시계','<span style="color:#ff9f0a">⏰<br>알람</span>','⏱<br>스톱워치','⏲<br>타이머'].map(x=>`<span style="text-align:center">${x}</span>`).join('')}</div></div>`;
V.safari=()=>`<div class="view gbg">${nav('방문 기록','','완료')}<div class="search" style="background:#e3e3e8">🔍 방문 기록 검색</div><div class="scroll sfhist">
${HIST.map(([d,L])=>`<div class="secl">${d}</div><div class="ilist">${L.map(q=>`<div class="irow"><span class="ii" style="background:#e5e5ea;color:#8e8e93">🔍</span><div class="tt">${q}<small>검색</small></div></div>`).join('')}</div>`).join('')}</div></div>`;
V.settings=()=>`<div class="view gbg"><div style="padding-top:54px"></div><div class="big">설정</div><div class="search" style="background:#e3e3e8">🔍 검색</div><div class="scroll">
<div class="ilist"><div class="irow">${av('P03',58)}<div class="tt"><b style="font-size:19px;font-weight:500">엄성현</b><small>Apple 계정, iCloud 등</small></div><span class="rv">›</span></div></div>
<div class="ilist">${[['✈️','#ff9500','에어플레인 모드','<div class="tog"></div>'],['📶','#007aff','Wi-Fi','HGU_Art_5G ›'],['🔵','#007aff','Bluetooth','건호 에어팟 ›']].map(([i,c,t,r])=>`<div class="irow"><span class="ii" style="background:${c}">${i}</span><div class="tt">${t}</div><span class="rv">${r}</span></div>`).join('')}</div>
<div class="ilist">${[['🔔','#ff3b30','알림'],['🌙','#5e5ce6','집중 모드','대회 전날 ›'],['⏳','#5e5ce6','스크린 타임','','screentime']].map(([i,c,t,r,go])=>`<div class="irow" ${go?`onclick="go('${go}')"`:''}><span class="ii" style="background:${c}">${i}</span><div class="tt">${t}</div><span class="rv">${r||'›'}</span></div>`).join('')}</div>
<div class="ilist">${[['🖼️','#34aadc','배경화면','P01 · P02 ›'],['🔒','#ff3b30','Face ID 및 암호','›'],['🔋','#34c759','배터리','41% ›']].map(([i,c,t,r])=>`<div class="irow"><span class="ii" style="background:${c}">${i}</span><div class="tt">${t}</div><span class="rv">${r}</span></div>`).join('')}</div></div></div>`;
V.screentime=()=>`<div class="view gbg">${nav('스크린 타임','설정')}<div class="scroll"><div class="secl">이번 주</div>
<div class="ilist" style="padding:16px 0 30px"><div style="padding:0 16px 14px"><small style="color:#8e8e93">일일 평균</small><div style="font-size:28px;font-weight:600">6시간 12분</div><small style="color:#8e8e93">지난주보다 14% 증가</small></div>
<div class="stbar">${[['월',58],['화',96],['수',62],['목',70],['금',64],['토',80],['일',74]].map(([d,h])=>`<div style="height:${h}%;${d==='화'?'background:#5e5ce6':''}"><span>${d}</span></div>`).join('')}</div></div>
<div class="secl">가장 많이 사용</div><div class="ilist">${[['kakao','카카오톡','2시간 41분'],['music','음악','1시간 22분'],['insta','Instagram','58분'],['notes','메모','34분'],['et','에브리타임','21분']].map(([k,n,t])=>`<div class="irow"><span style="width:30px;height:30px;border-radius:7px;overflow:hidden;flex:none;display:block">${IC[k].replace('class="ic"','class="ic" data-x="1"')}</span><div class="tt">${n}</div><span class="rv">${t}</span></div>`).join('')}</div>
<div class="secl">알림</div><div class="ilist"><div class="irow"><div class="tt">카카오톡<small>하루 평균 58회 · 주로 오전 5시–8시</small></div></div></div></div></div>`;

/* ================= FIT ================= */
function fit(){const d=$('#device');if(innerWidth<=500){d.style.transform='';return}const s=Math.min(1,(innerHeight-24)/868,(innerWidth-24)/414);d.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();render();
</script>
</body>
</html>
